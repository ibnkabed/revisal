# Revisal iPhone app (XcodeGen). Built unsigned by .github/workflows/build-ipa.yml.
name: Revisal
options:
  bundleIdPrefix: io.github.ibnkabed
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
targets:
  Revisal:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Revisal
      - path: ../bank
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ibnkabed.revisal
        PRODUCT_NAME: Revisal
        INFOPLIST_FILE: Revisal/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  # CI only: checks the review rules, the bank draw and the bundled banks.
  RevisalCheck:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Revisal/Model/Models.swift
      - path: Revisal/Review/ReviewRules.swift
      - path: Revisal/Review/Pattern.swift
      - path: Revisal/Book/BookRules.swift
      - path: Revisal/Bank/Bank.swift
      - path: RevisalCheck
    settings:
      base:
        PRODUCT_NAME: RevisalCheck
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
