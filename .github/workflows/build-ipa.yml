# Revisal iPhone app: checks the review rules and the bundled question banks, then builds an unsigned IPA
# for Sideloadly. A pushed tag v* also attaches the IPA to a GitHub Release.
name: Build Revisal IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Check the rules and build the unsigned Revisal IPA
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build RevisalCheck
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/Revisal.xcodeproj \
            -scheme RevisalCheck \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/check-build" \
            build

      - name: Check the review writer's rules (checks, skills, targets, balance)
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/check-build/Build/Products/Release/RevisalCheck" --review-selftest

      - name: Check the bank draw (no repeats until the bank is done)
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/check-build/Build/Products/Release/RevisalCheck" --bank-selftest

      - name: Check the bundled question banks
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/check-build/Build/Products/Release/RevisalCheck" --bank-check bank

      - name: Build for a physical iPhone without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/Revisal.xcodeproj \
            -scheme Revisal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app_path="ios/build/Build/Products/Release-iphoneos/Revisal.app"
          test -d "$app_path"
          test -f "$app_path/bank/qudurat.json"
          mkdir -p artifact/Payload
          ditto "$app_path" "artifact/Payload/Revisal.app"
          cd artifact
          /usr/bin/zip -qry Revisal-unsigned.ipa Payload
          shasum -a 256 Revisal-unsigned.ipa > Revisal-unsigned.ipa.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Revisal-unsigned-IPA
          path: |
            artifact/Revisal-unsigned.ipa
            artifact/Revisal-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach the IPA to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-unsigned-ipa
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: Revisal-unsigned-IPA
          path: artifact

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifact/Revisal-unsigned.ipa
            artifact/Revisal-unsigned.ipa.sha256
